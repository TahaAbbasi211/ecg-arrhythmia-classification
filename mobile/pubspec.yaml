name: ecg_beat_classifier
description: "ECG Beat Classifier - offline single-lead heartbeat classification (N, S, V)."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ecg_config.json
    - assets/ecg_forest.json
    - assets/samples/record_100.csv
    - assets/samples/record_200.csv
    - assets/samples/record_233.csv
